<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>猫の鼻模様雑学 A4資料</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #f7f4ef;
  }
  .page {
    width: 210mm;
    height: 297mm;
    margin: 0 auto;
    background: white;
    display: grid;
    grid-template-rows: 58% 42%;
    overflow: hidden;
    box-shadow: 0 0 12px rgba(0,0,0,0.08);
  }
  .hero {
    position: relative;
    overflow: hidden;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.92);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.05));
  }
  .title {
    position: absolute;
    left: 18mm;
    bottom: 18mm;
    color: white;
  }
  .title h1 {
    margin: 0;
    font-size: 28pt;
    line-height: 1.2;
    letter-spacing: 0.04em;
  }
  .title p {
    margin: 6mm 0 0;
    font-size: 12pt;
    opacity: 0.95;
  }
  .content {
    padding: 16mm 18mm;
    display: grid;
    grid-template-columns: 1.3fr 0.7fr;
    gap: 12mm;
    background: linear-gradient(135deg, #fffdf9, #f5efe4);
  }
  .fact-box {
    border-left: 6px solid #c89b5b;
    padding-left: 8mm;
  }
  .fact-box h2 {
    margin: 0 0 6mm;
    font-size: 18pt;
    color: #3a3128;
  }
  .fact-box p {
    margin: 0;
    font-size: 12pt;
    line-height: 1.9;
    color: #333;
  }
  .mini-card {
    background: white;
    border-radius: 14px;
    padding: 8mm;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    border: 1px solid #eee3d3;
  }
  .mini-card h3 {
    margin: 0 0 4mm;
    font-size: 14pt;
    color: #6d5231;
  }
  .mini-card p {
    margin: 0;
    font-size: 10.5pt;
    line-height: 1.8;
    color: #444;
  }
  .paw {
    font-size: 22pt;
    margin-bottom: 3mm;
  }
</style>
</head>

    <section class="content">
      <div class="fact-box">
        <h2>雑学：鼻の模様は指紋のように全部違う</h2>
        <p>
          猫の鼻先にある細かな凹凸や線の模様は、
          <strong>一匹一匹すべて異なります。</strong>
          人間の指紋と同じように個体識別に使えるほど固有性があり、
          同じ模様の猫は存在しないとされています。
          鼻のしわ・溝・斑点の配置がそれぞれ異なるため、
          愛猫だけの「唯一のサイン」とも言えます。
        </p>
      </div>

      <div class="mini-card">
        <div class="paw">🐾</div>
        <h3>観察ポイント</h3>
        <p>
          明るい場所で鼻先をよく見ると、
          小さな線や粒状の模様が見えます。
          写真に残しておくと成長記録にもなります。
        </p>
